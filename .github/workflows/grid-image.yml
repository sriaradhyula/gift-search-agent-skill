name: Gift Search Grid image

on:
  push:
    branches: [main, 'codex/grid-gift-search*']
    paths: [.github/workflows/grid-image.yml, deploy/grid/**, docs/**, server/**, skills/**, package*.json, LICENSE, NOTICE]
  pull_request:
    paths: [.github/workflows/grid-image.yml, deploy/grid/**, docs/**, server/**, skills/**, package*.json, LICENSE, NOTICE]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --prefix deploy/grid --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: node --test deploy/grid/server.test.js
      - run: npm run build:dashboard && git diff --exit-code
  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: deploy/grid/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Gift Search
      - name: Record the immutable image reference
        env:
          REPO: ${{ github.repository }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf '%s\n' "ghcr.io/${REPO}@${DIGEST}" > image.txt
          cat image.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: gift-search-grid-image
          path: image.txt
      - uses: docker/build-push-action@v6
        id: worker
        with:
          context: .
          file: deploy/grid/worker.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:worker-sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Gift Search worker
      - name: Record the immutable worker image reference
        env:
          REPO: ${{ github.repository }}
          DIGEST: ${{ steps.worker.outputs.digest }}
        run: |
          printf '%s\n' "ghcr.io/${REPO}@${DIGEST}" > worker-image.txt
          cat worker-image.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: gift-search-grid-worker-image
          path: worker-image.txt
